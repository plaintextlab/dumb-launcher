name: Screenshots
# Temporary: boots an emulator and screenshots the main screens, to check the design.
on:
  push:
    branches: [start-polish]
  workflow_dispatch:
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: ./gradlew assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -skin 480x800
          script: |
            adb shell wm density 280
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell cmd package set-home-activity com.plaintextlab.dumblauncher/.HomeActivity || true
            mkdir -p shots
            adb shell am start -W -n com.plaintextlab.dumblauncher/.HomeActivity ; sleep 6
            adb shell input keyevent 4 ; sleep 2
            adb exec-out screencap -p > shots/1-home.png
            adb shell input motionevent DOWN 80 160 ; sleep 1.5
            adb shell input motionevent MOVE 150 260 ; sleep 0.3
            adb shell input motionevent MOVE 300 330 ; sleep 0.3
            adb shell input motionevent MOVE 380 340 ; sleep 1.5
            adb exec-out screencap -p > shots/2-dragging.png
            adb shell input motionevent UP 380 340 ; sleep 2
            adb exec-out screencap -p > shots/3-dropped.png
            adb shell input keyevent 22 ; sleep 1 ; adb shell input keyevent --longpress 23 ; sleep 2
            adb exec-out screencap -p > shots/4-tile-menu.png
            adb shell input keyevent 20 ; adb shell input keyevent 20 ; adb shell input keyevent 23 ; sleep 2
            adb exec-out screencap -p > shots/5-colours.png
            adb shell input keyevent 4 ; sleep 1
            adb shell input keyevent 7 ; sleep 3
            adb exec-out screencap -p > shots/6-drawer-from-0.png
            adb shell input tap 240 95 ; sleep 3
            adb exec-out screencap -p > shots/7-keyboard.png
            adb shell input text cam ; sleep 2
            adb exec-out screencap -p > shots/8-typed.png
            adb shell input keyevent 4 ; sleep 1 ; adb shell input keyevent 4 ; sleep 1 ; adb shell input keyevent 4 ; sleep 2
            adb shell input swipe 420 400 60 400 120 ; sleep 3
            adb exec-out screencap -p > shots/9-drawer-from-swipe.png
            adb shell input swipe 60 400 420 400 120 ; sleep 3
            adb exec-out screencap -p > shots/10-back-home.png
      - uses: actions/upload-artifact@v4
        with:
          name: shots
          path: shots/
          compression-level: 0
