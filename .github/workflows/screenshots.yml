name: Screenshots
# Temporary: boots an emulator and screenshots the main screens, to check the design.
on:
  push:
    branches: [metro-start]
  workflow_dispatch:
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: ./gradlew assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -skin 480x800
          script: |
            adb shell wm density 280
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell cmd package set-home-activity com.plaintextlab.dumblauncher/.HomeActivity || true
            mkdir -p shots
            adb shell am start -W -n com.plaintextlab.dumblauncher/.HomeActivity ; sleep 6
            adb shell input keyevent 4 ; sleep 2
            adb exec-out screencap -p > shots/1-home.png
            adb shell input keyevent 23 ; sleep 4
            adb exec-out screencap -p > shots/2-drawer.png
            adb shell input keyevent 22 ; adb shell input keyevent 22 ; adb shell input keyevent 20 ; sleep 2
            adb exec-out screencap -p > shots/3-drawer-selected.png
            adb shell input keyevent 82 ; sleep 2
            adb exec-out screencap -p > shots/4-options.png
            adb shell input keyevent 4 ; sleep 1 ; adb shell input keyevent 4 ; sleep 2
            adb shell input keyevent 82 ; sleep 3
            adb exec-out screencap -p > shots/5-settings.png
            adb shell input keyevent 20 ; adb shell input keyevent 20 ; sleep 2
            adb exec-out screencap -p > shots/6-settings-selected.png
      - uses: actions/upload-artifact@v4
        with:
          name: shots
          path: shots/
          compression-level: 0
