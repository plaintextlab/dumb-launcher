name: Release
# Publishes a GitHub release (tag + signed APK) whenever the versionName in
# app/build.gradle.kts has not been released yet. Bump the version to release.
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decide whether to release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_KEY: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          TAG="v$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG is already released."; echo "go=false" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_KEY" != "true" ]; then
            echo "::warning::Not releasing $TAG: add the signing secrets (see README > Releasing), then re-run this workflow."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v4
        if: steps.check.outputs.go == 'true'
        with:
          distribution: temurin
          java-version: 17
      - name: Build signed APK
        if: steps.check.outputs.go == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE: release.keystore
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          ./gradlew assembleRelease testDebugUnitTest
          cp app/build/outputs/apk/release/app-release.apk "dumb-launcher-$TAG.apk"
      - uses: softprops/action-gh-release@v2
        if: steps.check.outputs.go == 'true'
        with:
          tag_name: ${{ steps.check.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Dumb Launcher ${{ steps.check.outputs.tag }}
          generate_release_notes: true
          files: dumb-launcher-${{ steps.check.outputs.tag }}.apk
